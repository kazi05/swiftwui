server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    # application/wasm is in modern nginx mime.types; pinned here regardless —
    # wrong MIME silently disables streaming instantiation.
    types { application/wasm wasm; }
    include /etc/nginx/mime.types;
    # SwiftWUI ships unhashed filenames: every asset must revalidate (ETag/304).
    # Instant repeat loads come from the service-worker cache, not the HTTP cache.
    add_header Cache-Control "no-cache";
    location / { try_files $uri $uri/index.html /index.html; }
}
