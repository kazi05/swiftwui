name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  native-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Swift 6.4.0 toolchain
        run: bash Scripts/install-swift-ci.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: swift --version
      - name: Build native test bundle
        timeout-minutes: 15
        run: swift build --build-tests -Xswiftc -warnings-as-errors
      - name: Run native tests
        timeout-minutes: 5
        # SwiftPM block-buffers test output into a pipe; line-buffer so a hang's last test name survives.
        run: stdbuf -oL swift test --skip-build
      - run: node --test Tests/RegistrationGenerator/*.test.mjs
      - run: swift build -c release --product swiftwui -Xswiftc -warnings-as-errors
      - run: node --experimental-vm-modules --test Tests/BootJS/boot-stall.test.mjs
      # Evidence for a future Observation adapter (Experiments/README.md); it is
      # not part of the supported target graph, so it reports without gating.
      - name: Swift 6.4 SE-0506 continuous observation probe (experiment)
        continue-on-error: true
        run: SWIFT64="$(command -v swift)" SWIFTC64="$(command -v swiftc)" bash Experiments/Swift64/run-se0506.sh

  # The manifest stays at swift-tools-version 6.2, so keep proving that the
  # previous pinned release still builds and passes the native suite.
  native-compat-6-3:
    runs-on: ubuntu-24.04
    env:
      SWIFTWUI_SWIFT_VERSION: 6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Swift 6.3.3 toolchain
        run: bash Scripts/install-swift-ci.sh
      - run: swift --version
      - name: Build native test bundle
        timeout-minutes: 15
        run: swift build --build-tests
      - name: Run native tests
        timeout-minutes: 5
        # SwiftPM block-buffers test output into a pipe; line-buffer so a hang's last test name survives.
        run: stdbuf -oL swift test --skip-build

  wasm-and-browser:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: counter
            project: Examples/Counter
            product: Counter
            budget: Examples/Counter/wasm-budget.json
          - fixture: todomvc
            project: Examples/TodoMVC
            product: TodoMVC
            budget: Examples/TodoMVC/wasm-budget.json
          - fixture: tutorial
            project: Sites/Tutorial
            product: TutorialSite
            budget: Sites/Tutorial/wasm-budget.json
    env:
      SWIFTWUI_WASM_SDK: swift-6.4.0-RELEASE_wasm
      # Pinned official bundle: swift.org/documentation/articles/wasm-getting-started.html
      SWIFTWUI_WASM_SDK_URL: https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz
      SWIFTWUI_WASM_SDK_SHA256: f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
      SWIFTWUI_BROWSER_SDK: swift-6.4.0-RELEASE_wasm
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Swift 6.4.0 toolchain
        run: bash Scripts/install-swift-ci.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the checked WASM SDK bundle
        run: |
          test -n "$SWIFTWUI_WASM_SDK_URL"
          test -n "$SWIFTWUI_WASM_SDK_SHA256"
          sdk_archive="$RUNNER_TEMP/$SWIFTWUI_WASM_SDK.artifactbundle.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --retry-all-errors \
            "$SWIFTWUI_WASM_SDK_URL" --output "$sdk_archive"
          printf '%s  %s\n' "$SWIFTWUI_WASM_SDK_SHA256" "$sdk_archive" | sha256sum --check --strict
          swift sdk install "$sdk_archive"
      - run: swift --version
      - run: swift sdk list
      - name: Strict wasm build of SwiftWUIDOM
        if: matrix.fixture == 'counter'
        run: swift build --swift-sdk "$SWIFTWUI_WASM_SDK" --scratch-path .build-wasm --target SwiftWUIDOM -Xswiftc -warnings-as-errors
      - name: Install pinned optimizer and compression tools
        run: |
          curl -fsSL https://github.com/WebAssembly/binaryen/releases/download/version_130/binaryen-version_130-x86_64-linux.tar.gz -o "$RUNNER_TEMP/binaryen.tar.gz"
          printf '%s  %s\n' 0a18362361ad05465118cd8eeb72edaeec89de6894bc283576ef4e07aa3babcc "$RUNNER_TEMP/binaryen.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/binaryen"
          tar -xzf "$RUNNER_TEMP/binaryen.tar.gz" -C "$RUNNER_TEMP/binaryen" --strip-components=1
          echo "$RUNNER_TEMP/binaryen/bin" >> "$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y brotli
      - name: Require an explicitly provisioned matching SDK
        run: test -n "$SWIFTWUI_WASM_SDK"
      - name: Clean ${{ matrix.fixture }} WASM release build
        working-directory: ${{ matrix.project }}
        run: swift package --swift-sdk "$SWIFTWUI_WASM_SDK" --scratch-path .build-wasm-ci js -c release
      # PackageToJS < 0.58 misread Swift Build's artifact layout and silently
      # dropped WASI from the JS glue; the bundle then fails only in a browser.
      - name: Check ${{ matrix.fixture }} bundle provides its WASI imports
        working-directory: ${{ matrix.project }}/.build-wasm-ci/plugins/PackageToJS/outputs/Package
        run: |
          node -e '
            const fs = require("node:fs");
            const wasm = fs.readdirSync(".").find(f => f.endsWith(".wasm"));
            const modules = WebAssembly.Module.imports(new WebAssembly.Module(fs.readFileSync(wasm))).map(i => i.module);
            if (modules.includes("wasi_snapshot_preview1") && !fs.readFileSync("instantiate.js", "utf8").includes("wasi_snapshot_preview1")) {
              console.error(`${wasm} imports wasi_snapshot_preview1 but instantiate.js never provides it`);
              process.exit(1);
            }'
      - name: Build metrics command
        run: swift build --product swiftwui
      - name: Enforce ${{ matrix.fixture }} release budget
        run: |
          report_dir="$RUNNER_TEMP/${{ matrix.fixture }}-dist"
          mkdir -p "$report_dir/app"
          cp "${{ matrix.project }}/.build-wasm-ci/plugins/PackageToJS/outputs/Package/${{ matrix.product }}.wasm" "$report_dir/app/${{ matrix.product }}.wasm"
          gzip -kfn9 "$report_dir/app/${{ matrix.product }}.wasm"
          brotli -f -q 11 "$report_dir/app/${{ matrix.product }}.wasm"
          .build/debug/swiftwui metrics --out "$report_dir" --fixture "${{ matrix.fixture }}" --budget "${{ matrix.budget }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.fixture }}-wasm-report
          path: ${{ runner.temp }}/${{ matrix.fixture }}-dist/swiftwui-build-report.json
      - name: Browser fixture
        if: matrix.fixture == 'counter'
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix Sites/Tutorial/tools/screenshots
      - if: matrix.fixture == 'counter'
        run: npx --prefix Sites/Tutorial/tools/screenshots playwright install --with-deps chromium
      - name: Run browser fixture
        if: matrix.fixture == 'counter'
        working-directory: Tests/BrowserEvents
        run: bash run.sh
      - if: matrix.fixture == 'counter'
        run: node --experimental-vm-modules --test Tests/BootJS/*.test.mjs Tests/Workers/*.test.mjs

  apple-release:
    # The brew formula runs this build with the user's Xcode toolchain; Linux cannot
    # see Apple-target optimizer crashes (v0.9.0) or Xcode-SDK-only errors.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, xcode: /Applications/Xcode_26.6.app, preview: false }   # Swift 6.3.3
          - { runner: xcode-27, xcode: /Applications/Xcode_27.app, preview: true }      # Swift 6.4, preview image
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s "${{ matrix.xcode }}"
      - run: swift --version
      - run: swift build -c release --product swiftwui --disable-sandbox
