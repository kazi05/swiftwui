# DocC API reference deploy. Pushes the rendered SwiftWUI documentation to
# the repository's GitHub Pages site so it is browsable at
# https://<org>.github.io/SwiftWUI/.

name: Docs

on:
  push:
    branches: [main]

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.2.3"

      - name: Generate DocC for umbrella SwiftWUI module
        run: |
          swift package generate-documentation \
            --target SwiftWUI \
            --output-path ./_site \
            --transform-for-static-hosting \
            --hosting-base-path SwiftWUI

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - uses: actions/deploy-pages@v4
