# Weekly bot-driven updates so SwiftPM and Actions versions never drift far
# behind upstream. Major-version bumps still require manual review since they
# can carry breaking changes (Vapor 4 → 5, swiftwasm SDK majors, etc.).

version: 2
updates:
  - package-ecosystem: swift
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "swift"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
